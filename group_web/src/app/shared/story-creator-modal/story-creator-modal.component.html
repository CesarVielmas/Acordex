<div class="fixed inset-0 z-50 flex items-center justify-center group-app-backdrop p-3 sm:p-6">
  <!-- Click Backdrop -->
  <div class="absolute inset-0" (click)="close.emit()"></div>

  <!-- Creator Shell -->
  <div class="relative z-10 flex w-full max-w-lg flex-col overflow-hidden rounded-3xl group-app-modal p-5 sm:p-6 shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-surface-variant/40 pb-3">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/20 text-primary">
          <span class="material-symbols-outlined text-lg">history_toggle_off</span>
        </div>
        <div>
          <h3 class="font-headline-md text-base font-bold text-on-surface">Subir Nueva Historia (24h)</h3>
          <p class="text-[11px] text-on-surface-variant">Visible para todos los clientes y seguidores en Acordex</p>
        </div>
      </div>

      <button type="button" (click)="close.emit()" class="text-on-surface-variant hover:text-white">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="mt-4 space-y-4 max-h-[70vh] overflow-y-auto pr-1">
      <!-- Media Preview -->
      <div class="relative h-56 w-full overflow-hidden rounded-2xl bg-black/60 ring-1 ring-white/10 flex items-center justify-center">
        <img 
          *ngIf="mediaType() === 'image'" 
          [src]="mediaUrl()" 
          alt="Preview" 
          class="h-full w-full object-cover" 
        />
        <video 
          *ngIf="mediaType() === 'video'" 
          [src]="mediaUrl()" 
          autoplay 
          muted 
          loop 
          class="h-full w-full object-cover"
        ></video>

        <!-- Preview Badges -->
        <div class="absolute bottom-3 left-3 right-3 flex flex-wrap gap-1.5 pointer-events-none">
          <span *ngIf="locationTag()" class="flex items-center gap-1 rounded-full bg-black/70 px-2 py-0.5 text-[10px] text-white">
            <span class="material-symbols-outlined text-xs text-rose-400">location_on</span>
            <span>{{ locationTag() }}</span>
          </span>
          <span *ngIf="musicTag()" class="flex items-center gap-1 rounded-full bg-primary/30 px-2 py-0.5 text-[10px] text-primary">
            <span class="material-symbols-outlined text-xs">music_note</span>
            <span>{{ musicTag() }}</span>
          </span>
        </div>
      </div>

      <!-- Presets / Upload -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1.5">Elegir Fotografía o Clip</label>
        <div class="flex flex-wrap gap-2">
          <button 
            *ngFor="let p of presetMedia"
            type="button"
            (click)="selectPreset(p)"
            class="rounded-xl border px-2.5 py-1 text-xs font-medium transition"
            [ngClass]="mediaUrl() === p.url ? 'border-primary bg-primary/15 text-primary' : 'border-surface-variant/60 text-on-surface-variant hover:border-primary/40'"
          >
            {{ p.label }}
          </button>
          
          <label class="cursor-pointer rounded-xl border border-dashed border-primary/50 bg-primary/5 px-2.5 py-1 text-xs font-medium text-primary hover:bg-primary/15 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">upload_file</span>
            <span>Cargar Archivo</span>
            <input type="file" (change)="onFileSelected($event)" accept="image/*,video/*" class="hidden" />
          </label>
        </div>
      </div>

      <!-- Caption -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1">Texto / Mensaje de la Historia</label>
        <input 
          type="text" 
          [ngModel]="caption()" 
          (ngModelChange)="caption.set($event)"
          placeholder="Ej: ¡Probando sonido antes del show en vivo! 🎺🔥" 
          class="w-full rounded-xl border border-surface-variant/60 bg-surface-container px-3.5 py-2 text-xs text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:outline-none"
        />
      </div>

      <!-- Tags Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Sticker de Ubicación</label>
          <input 
            type="text" 
            [ngModel]="locationTag()" 
            (ngModelChange)="locationTag.set($event)"
            placeholder="Ej: Palenque Guadalajara" 
            class="w-full rounded-xl border border-surface-variant/60 bg-surface-container px-3.5 py-2 text-xs text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1">Canción de Fondo</label>
          <input 
            type="text" 
            [ngModel]="musicTag()" 
            (ngModelChange)="musicTag.set($event)"
            placeholder="Ej: Mi Reina Sinaloense" 
            class="w-full rounded-xl border border-surface-variant/60 bg-surface-container px-3.5 py-2 text-xs text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:outline-none"
          />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-5 flex items-center justify-end gap-3 border-t border-surface-variant/40 pt-3">
      <button 
        type="button" 
        (click)="close.emit()"
        class="rounded-xl border border-surface-variant/60 px-4 py-2 text-xs font-semibold text-on-surface-variant hover:bg-surface-container"
      >
        Cancelar
      </button>

      <button 
        type="button" 
        (click)="publishStory()"
        class="flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-primary to-tertiary px-5 py-2 text-xs font-bold text-on-primary shadow-lg shadow-primary/20 hover:opacity-95 active:scale-95 transition"
      >
        <span class="material-symbols-outlined text-base">send</span>
        <span>Publicar Historia (24h)</span>
      </button>
    </div>
  </div>
</div>
