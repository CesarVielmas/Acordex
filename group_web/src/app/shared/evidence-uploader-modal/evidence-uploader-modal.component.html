<div class="fixed inset-0 z-50 flex items-center justify-center group-app-backdrop p-3 sm:p-6">
  <!-- Click Backdrop -->
  <div class="absolute inset-0" (click)="close.emit()"></div>

  <!-- Uploader Shell -->
  <div class="relative z-10 flex w-full max-w-lg flex-col overflow-hidden rounded-3xl group-app-modal p-5 sm:p-6 shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-surface-variant/40 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary/20 text-primary">
          <span class="material-symbols-outlined text-xl">add_a_photo</span>
        </div>
        <div>
          <h3 class="font-headline-md text-base font-bold text-on-surface">Subir Evidencia del Evento</h3>
          <p class="text-[11px] text-on-surface-variant truncate max-w-xs">{{ event?.title }}</p>
        </div>
      </div>

      <button type="button" (click)="close.emit()" class="text-on-surface-variant hover:text-white">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="mt-4 space-y-4 max-h-[70vh] overflow-y-auto pr-1">
      <!-- Media Preview -->
      <div class="relative h-52 w-full overflow-hidden rounded-2xl bg-black/60 ring-1 ring-white/10 flex items-center justify-center">
        <img 
          *ngIf="mediaType() === 'photo'" 
          [src]="mediaUrl()" 
          alt="Preview" 
          class="h-full w-full object-cover" 
        />
        <video 
          *ngIf="mediaType() === 'video'" 
          [src]="mediaUrl()" 
          autoplay 
          muted 
          loop 
          class="h-full w-full object-cover"
        ></video>

        <span class="absolute top-3 left-3 rounded-full bg-black/70 px-2.5 py-0.5 text-[10px] font-bold text-primary backdrop-blur-md border border-primary/30">
          {{ category() }}
        </span>
      </div>

      <!-- Presets / Upload -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1.5">Fotografías Recomendadas o Carga Propia</label>
        <div class="flex flex-wrap gap-2">
          <button 
            *ngFor="let p of presetImages"
            type="button"
            (click)="selectPreset(p)"
            class="rounded-xl border px-2.5 py-1 text-xs font-medium transition"
            [ngClass]="mediaUrl() === p.url ? 'border-primary bg-primary/15 text-primary' : 'border-surface-variant/60 text-on-surface-variant hover:border-primary/40'"
          >
            {{ p.label }}
          </button>
          
          <label class="cursor-pointer rounded-xl border border-dashed border-primary/50 bg-primary/5 px-2.5 py-1 text-xs font-medium text-primary hover:bg-primary/15 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">upload_file</span>
            <span>Subir de Galería</span>
            <input type="file" (change)="onFileSelected($event)" accept="image/*,video/*" class="hidden" />
          </label>
        </div>
      </div>

      <!-- Category Picker -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1">Categoría de la Foto</label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button 
            *ngFor="let cat of categoriesList"
            type="button"
            (click)="setCategory(cat)"
            class="rounded-xl border py-1.5 text-center text-xs font-medium transition"
            [ngClass]="category() === cat ? 'border-primary bg-primary/15 text-primary font-bold' : 'border-surface-variant/60 text-on-surface-variant hover:bg-surface-container'"
          >
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- Caption -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1">Descripción / Pie de Foto</label>
        <input 
          type="text" 
          [ngModel]="caption()" 
          (ngModelChange)="caption.set($event)"
          placeholder="Ej: Momento cumbre durante el tema principal ante más de 5,000 personas." 
          class="w-full rounded-xl border border-surface-variant/60 bg-surface-container px-3.5 py-2 text-xs text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:outline-none"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-5 flex items-center justify-end gap-3 border-t border-surface-variant/40 pt-3">
      <button 
        type="button" 
        (click)="close.emit()"
        class="rounded-xl border border-surface-variant/60 px-4 py-2 text-xs font-semibold text-on-surface-variant hover:bg-surface-container"
      >
        Cancelar
      </button>

      <button 
        type="button" 
        (click)="saveEvidence()"
        class="flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-primary to-tertiary px-5 py-2 text-xs font-bold text-on-primary shadow-lg shadow-primary/20 hover:opacity-95 active:scale-95 transition"
      >
        <span class="material-symbols-outlined text-base">save</span>
        <span>Guardar en Bitácora del Evento</span>
      </button>
    </div>
  </div>
</div>
