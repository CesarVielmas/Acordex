<aside 
  class="relative flex h-screen flex-col justify-between border-r border-surface-variant/40 bg-[#161616] p-3.5 select-none transition-all duration-300 ease-in-out shadow-2xl"
  [ngClass]="layout.isSidebarCollapsed() ? 'w-20' : 'w-72'"
>
  <!-- ================= COLLAPSE / EXPAND TOGGLE BUTTON (CENTERED ON RIGHT EDGE) ================= -->
  <button 
    type="button"
    (click)="layout.toggleSidebar()"
    class="absolute top-1/2 -right-3.5 -translate-y-1/2 z-50 flex h-7 w-7 items-center justify-center rounded-full bg-primary text-black border-2 border-[#131313] shadow-xl transition-all duration-200 hover:scale-110 active:scale-95 cursor-pointer hover:bg-primary-fixed focus:outline-none"
    [title]="layout.isSidebarCollapsed() ? 'Expandir barra lateral' : 'Colapsar barra lateral'"
  >
    <span class="material-symbols-outlined text-base font-black transition-transform duration-300" [ngClass]="{'rotate-180': layout.isSidebarCollapsed()}">
      chevron_left
    </span>
  </button>

  <!-- ================= TOP: BRAND & GROUP IDENTIFIER ================= -->
  <div class="flex flex-col gap-4">
    <!-- Brand Logo -->
    <a 
      routerLink="/dashboard" 
      class="flex items-center gap-3 px-2 py-1 group cursor-pointer overflow-hidden rounded-xl transition hover:bg-white/5"
      [title]="layout.isSidebarCollapsed() ? 'Acordex - Portal de Grupos' : ''"
    >
      <img 
        src="acordex_without_bg.png" 
        alt="Acordex Logo" 
        class="h-10 w-10 sm:h-11 sm:w-11 object-contain transition-transform duration-300 group-hover:scale-105 flex-shrink-0" 
      />
      <div *ngIf="!layout.isSidebarCollapsed()" class="min-w-0 transition-opacity duration-200">
        <div class="font-['Epilogue'] font-black text-xl text-primary tracking-tighter leading-none">ACORDEX</div>
        <div class="text-[9px] font-extrabold uppercase tracking-widest text-on-surface-variant mt-0.5">PORTAL DE GRUPOS</div>
      </div>
    </a>

    <!-- Active Band Card Mini -->
    <div 
      class="rounded-2xl border border-surface-variant/40 bg-surface-container/70 p-2.5 shadow-inner transition-all overflow-hidden"
      [ngClass]="layout.isSidebarCollapsed() ? 'p-1.5 text-center' : 'p-3'"
    >
      <div class="flex items-center gap-3" [ngClass]="layout.isSidebarCollapsed() ? 'justify-center' : ''">
        <div class="relative flex-shrink-0">
          <img 
            [src]="groupData.activeProfile().avatarUrl" 
            [alt]="groupData.activeProfile().name"
            class="rounded-xl object-cover ring-2 ring-primary/40"
            [ngClass]="layout.isSidebarCollapsed() ? 'h-9 w-9' : 'h-11 w-11'"
          />
          <span 
            *ngIf="layout.isSidebarCollapsed()" 
            class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-400 ring-2 ring-[#131313]"
          ></span>
        </div>

        <div *ngIf="!layout.isSidebarCollapsed()" class="min-w-0 flex-1">
          <div class="truncate text-xs font-bold text-on-surface">{{ groupData.activeProfile().name }}</div>
          <div class="truncate text-[11px] text-on-surface-variant">{{ groupData.activeProfile().genre }}</div>
          <div class="mt-1 flex items-center gap-1.5 text-[10px] text-primary">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>{{ groupData.activeProfile().liveStatus }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="space-y-1 pt-1">
      <a
        *ngFor="let item of mainNavItems"
        [routerLink]="item.route"
        routerLinkActive="bg-primary/15 text-primary border-r-2 border-primary font-bold shadow-sm"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="group relative flex items-center rounded-xl transition hover:bg-surface-container hover:text-on-surface"
        [ngClass]="layout.isSidebarCollapsed() ? 'justify-center p-3 text-on-surface-variant' : 'justify-between px-3.5 py-2.5 text-xs font-medium text-on-surface-variant'"
        [title]="layout.isSidebarCollapsed() ? item.label : ''"
      >
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-xl flex-shrink-0 group-hover:scale-110 transition-transform">
            {{ item.icon }}
          </span>
          <span *ngIf="!layout.isSidebarCollapsed()" class="truncate">{{ item.label }}</span>
        </div>

        <!-- Badge when expanded -->
        <span 
          *ngIf="!layout.isSidebarCollapsed() && item.badge && item.badge()"
          class="rounded-full px-2 py-0.5 text-[10px] font-bold flex-shrink-0"
          [ngClass]="item.badgeColor || 'bg-surface-variant text-on-surface'"
        >
          {{ item.badge() }}
        </span>

        <!-- Floating Badge when collapsed -->
        <span 
          *ngIf="layout.isSidebarCollapsed() && item.badge && item.badge()"
          class="absolute top-1.5 right-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-primary text-[9px] font-extrabold text-black ring-2 ring-[#131313]"
        >
          {{ item.badge() }}
        </span>
      </a>
    </nav>
  </div>

  <!-- ================= BOTTOM: CONNECTION & VERSION ================= -->
  <div 
    class="rounded-xl border border-surface-variant/30 bg-surface-container-low/40 transition-all overflow-hidden"
    [ngClass]="layout.isSidebarCollapsed() ? 'p-2 text-center' : 'p-3'"
  >
    <div class="flex items-center justify-between text-[11px] text-on-surface-variant" [ngClass]="layout.isSidebarCollapsed() ? 'justify-center' : ''">
      <span class="flex items-center gap-1.5" [title]="layout.isSidebarCollapsed() ? 'Sincronizado v3.0.0' : ''">
        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span *ngIf="!layout.isSidebarCollapsed()" class="text-on-surface font-medium">Sincronizado</span>
      </span>
      <span *ngIf="!layout.isSidebarCollapsed()">v3.0.0</span>
    </div>
    <div *ngIf="!layout.isSidebarCollapsed()" class="mt-1 text-[10px] text-neutral-400 truncate">
      Conectado con admins_web & clients_web
    </div>
  </div>
</aside>
